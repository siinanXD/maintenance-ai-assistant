name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: testing
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-secret-key
      JWT_SECRET_KEY: ci-jwt-secret-key
      DATABASE_URL: "sqlite:///:memory:"
      AI_PROVIDER: mock
      OPENAI_API_KEY: ""
      OPENAI_MODEL: test-model
      UPLOAD_FOLDER: /tmp/maintenance-uploads
      DOCUMENTS_FOLDER: /tmp/maintenance-documents
      LOG_DIR: /tmp/maintenance-logs

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm --prefix frontend ci

      - name: Check React frontend
        run: npm run check:react

      - name: Build React frontend
        run: npm run build:react

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Compile Python files
        run: python -m compileall app migrations tests seed_demo.py seed.py run.py

      - name: Check JavaScript syntax
        run: |
          node --check app/static/auth.js
          node --check app/static/app.js
          node --check app/static/core/feature-registry.js
          node --check app/static/core/action-dialogs.js

      - name: Migration smoke test
        env:
          DATABASE_URL: sqlite:////tmp/maintenance-migration-smoke.db
          AUTO_CREATE_DATABASE: "false"
        run: |
          rm -f /tmp/maintenance-migration-smoke.db
          python -m flask --app run:app db upgrade

      - name: App startup check
        run: |
          python - <<'PY'
          from app import create_app

          app = create_app()
          client = app.test_client()
          response = client.get("/health")

          assert response.status_code == 200
          assert response.get_json() == {"status": "ok"}
          PY

      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=75

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag maintenance-assistant:ci .
